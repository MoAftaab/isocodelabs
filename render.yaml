services:
  - type: web
    name: forgequote-api-aftaab
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: rfq-source-documents
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GST_RATE_PERCENT
        value: "0"
      - key: AI_BASE_URL
        value: https://agentrouter.org/v1
      - key: AI_PROTOCOL
        value: openai
      - key: AI_MODEL
        value: gpt-6.1-sol
      - key: AI_NDA_APPROVED
        value: "false"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: OCR_LANGUAGE
        value: eng
      - key: SEED_DEMO_DATA
        value: "true"
      - key: BOOTSTRAP_ESTIMATOR_USERNAME
        sync: false
      - key: BOOTSTRAP_ESTIMATOR_PASSWORD
        sync: false
      - key: BOOTSTRAP_SALES_USERNAME
        sync: false
      - key: BOOTSTRAP_SALES_PASSWORD
        sync: false
